goal:
  metric: "TODO-primary-metric"
  direction: maximize # maximize / minimize
  unit: ratio # ratio 为 0–1，不要与 percent 的 0–100 混用
  baseline: null
  target: null
  current: null
  evalset: null # assets.yaml 中固定评测集的 ID
  evidence: [] # 当前指标的实验路径或原始报告 URL

# 列表条目格式参见 README 和 examples/README.md。
